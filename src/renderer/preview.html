<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Character Preview</title>
  <style>
    body { margin: 0; padding: 16px; background: #e9e4d4; font: 12px/1.3 Geneva, -apple-system, sans-serif; color: #222; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .cell { background: #fff; border: 1px solid #0002; border-radius: 6px; padding: 6px; text-align: center; }
    .cell .sprite { margin: 0 auto 4px; background-repeat: no-repeat; }
    .tag { display: inline-block; padding: 0 4px; border-radius: 3px; background: #d8ecd0; margin: 1px; }
    .tag.app-mapped { background: #f6dcc0; }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="grid" id="grid"></div>
  <script type="module" src="preview.js"></script>
</body>
</html>
