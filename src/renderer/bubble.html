<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Balloon</title>
  <link rel="stylesheet" href="bubble.css">
  <link rel="stylesheet" href="balloon-themes/classic.css">
  <link rel="stylesheet" href="balloon-themes/aqua.css">
  <link rel="stylesheet" href="balloon-themes/macos.css">
  <link rel="stylesheet" href="balloon-themes/win98.css">
  <link rel="stylesheet" href="balloon-themes/system7.css">
</head>
<body class="below" data-theme="classic">
  <section id="bubble">
    <!-- The balloon's shape (see bubble.css): layers each theme styles or
         switches on. -->
    <svg id="shape" aria-hidden="true">
      <defs>
        <path id="shape-path"/>
        <clipPath id="shape-clip"><use href="#shape-path"/></clipPath>
        <mask id="shape-outside" maskUnits="userSpaceOnUse" x="-20" y="-20" width="400" height="1000">
          <rect x="-20" y="-20" width="400" height="1000" fill="#fff"/>
          <use href="#shape-path" fill="#000"/>
        </mask>
        <filter id="shape-blur" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
        <linearGradient id="glass-fill" x1="0" y1="0" x2="0" y2="1">
          <stop class="fill-top" offset="0"/><stop class="fill-mid" offset="0.5"/><stop class="fill-bottom" offset="1"/>
        </linearGradient>
        <linearGradient id="glass-sheen" x1="0" y1="0" x2="0" y2="1">
          <stop class="sheen-top" offset="0"/><stop class="sheen-bottom" offset="1"/>
        </linearGradient>
        <radialGradient id="glass-glow" cx="0.5" cy="1" r="0.75">
          <stop class="glow-in" offset="0"/><stop class="glow-out" offset="1"/>
        </radialGradient>
      </defs>
      <!-- Shadows only outside the shape, so a translucent fill stays clean. -->
      <g mask="url(#shape-outside)">
        <use class="shadow-soft" href="#shape-path" filter="url(#shape-blur)"/>
        <use class="shadow-hard" href="#shape-path"/>
      </g>
      <use class="fill" href="#shape-path"/>
      <g class="glass" clip-path="url(#shape-clip)">
        <rect id="glass-glow" class="glow"/>
        <rect id="glass-sheen" class="sheen" rx="8"/>
        <use class="inner-rim" href="#shape-path"/>
      </g>
      <g class="bevel">
        <path id="bevel-inner-light" class="bevel-inner-light"/>
        <path id="bevel-inner-dark" class="bevel-inner-dark"/>
      </g>
      <path id="tail-patch" class="tail-patch"/>
      <use class="rim" href="#shape-path"/>
      <g class="bevel">
        <path id="bevel-outer-light" class="bevel-outer-light"/>
        <path id="bevel-outer-dark" class="bevel-outer-dark"/>
      </g>
    </svg>
    <div id="msg" aria-live="polite"></div>
    <form id="ask" autocomplete="off">
      <input id="input" type="text" placeholder="Ask me anything…" spellcheck="false">
      <button id="send" type="submit" aria-label="Send" disabled>
        <svg class="send-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 13V3.5M3.8 7.6 8 3.4l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="send-label" aria-hidden="true">Send</span>
      </button>
    </form>
  </section>
  <script type="module" src="bubble.js"></script>
</body>
</html>
